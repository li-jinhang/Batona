# Nginx 反代配置 — DSH Remote Gateway
# 用途：把 https://<域名或IP> 转发到本机网关 127.0.0.1:3090，并终结 TLS。
#
# 两种用法：
#   A. 宝塔面板（推荐）：网站 → 添加站点 → 反向代理 →
#      目标 URL: http://127.0.0.1:3090，发送域名留空；
#      然后 网站 → SSL 开启证书（域名走 Let's Encrypt / 无域名导入自签）。
#      （宝塔会自动生成类似本文件的 server 块，无需手动改）
#   B. 手动 Nginx：把本文件放入 /etc/nginx/conf.d/ 并改占位符。
#
# 注意：/ws 是 WebSocket 升级路径，必须保留 Upgrade 头。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # ── 占位符：有域名填域名，无域名填公网 IP（配合自签证书）──
    server_name YOUR_DOMAIN_OR_IP;

    # ── 证书路径：自签（selfsigned-cert.sh 生成）或 Let's Encrypt ──
    ssl_certificate     /etc/nginx/ssl/dsh-gateway.crt;
    ssl_certificate_key /etc/nginx/ssl/dsh-gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 网关默认 300MiB 请求体上限（图片），透传即可
        client_max_body_size 300m;
    }
}

# 可选：HTTP → HTTPS 跳转
server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;
    return 301 https://$host$request_uri;
}
