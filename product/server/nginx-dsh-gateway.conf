# Nginx 反代配置 — DSH Remote Gateway
# 用途：WebMainIndex 提供首页，客户端接口转发到 127.0.0.1:3090。
#
# 两种用法：
#   A. 宝塔：站点根目录指向 WebMainIndex；将同目录的
#      nginx-dsh-gateway-routes.conf 放入站点 proxy include 目录，
#      替换原有 DSH 全站反代规则，保留其他项目规则和证书。
#   B. 手动 Nginx：把本文件放入 /etc/nginx/conf.d/ 并改占位符；
#      将 nginx-dsh-gateway-routes.conf 安装到下方 snippets 路径。
#
# 注意：/ws 是 WebSocket 升级路径，必须保留 Upgrade 头。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # ── 占位符：有域名填域名，无域名填公网 IP（配合自签证书）──
    server_name YOUR_DOMAIN_OR_IP;
    root /www/wwwroot/117.72.10.87/00-001WebMainIndex;
    index index.html;

    # ── 证书路径：自签（selfsigned-cert.sh 生成）或 Let's Encrypt ──
    ssl_certificate     /etc/nginx/ssl/dsh-gateway.crt;
    ssl_certificate_key /etc/nginx/ssl/dsh-gateway.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/nginx-dsh-gateway-routes.conf;
}

# 可选：HTTP → HTTPS 跳转
server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;
    return 301 https://$host$request_uri;
}
