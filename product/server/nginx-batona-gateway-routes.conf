# Include inside the HTTPS server block; root points to WebMainIndex.
# Keep native client URLs stable when changing the public homepage.
location = /pair.html {
    return 404;
}

if ($scheme = http) {
    return 301 https://$host$request_uri;
}

location / {
    try_files $uri $uri/ =404;
}

location ~ ^/(api(?:/|$)|ws$|tunnel$|healthz$|access-admin(?:\.js|\.css)?$) {
    proxy_pass http://127.0.0.1:3090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    client_max_body_size 300m;
}

# Legacy client is not an alternate authentication route after the hosted cutover.
location = /remote {
    return 301 /remote/;
}

location = /remote/manifest.webmanifest {
    default_type application/manifest+json;
    return 200 '{"name":"Batona Gateway","short_name":"Batona","start_url":"/remote/","scope":"/remote/","display":"standalone","background_color":"#0f1115","theme_color":"#0f1115","icons":[]}';
}

location /remote/ {
    return 410;
}
